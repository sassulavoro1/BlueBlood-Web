<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#07080c"/>
<title>BlueBlood Sala</title>
<style>
:root{--bg:#07080c;--card:#10131a;--gold:#e8c75a;--gold2:#b8923a;--ice:#c8d8f4;--green:#3feb7a;--red:#ff6b6b;--muted:#8a93a6;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#eef2f8;font-family:Georgia,system-ui,sans-serif;}
#start,#app{min-height:100dvh;padding:20px 16px 28px}
#app{display:none}
h1{color:var(--gold);letter-spacing:.18em;text-align:center;font-weight:600;margin:48px 0 8px;font-size:28px}
.sub{text-align:center;color:var(--ice);margin:0 0 8px}
.hint{text-align:center;color:var(--muted);font-size:13px}
.rules{max-width:420px;margin:24px auto;background:var(--card);border:1px solid #2a2416;border-radius:14px;padding:16px;text-align:center;color:#c9c3b4;font-size:14px}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
.gold{background:var(--gold2);color:#1a1408}
.blue{background:#1e2a44;color:#dce6ff}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.row button{flex:1;min-width:70px;font-size:13px}
.hud{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid #1c2230}
.cap{text-align:center;color:var(--gold);font-size:26px;margin:4px 0}
.pnl{text-align:center;font-size:14px}
.clock,.st,.watch{text-align:center;color:var(--muted);font-size:12px;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.desk{background:#0c1018;border:1px solid #222836;border-radius:10px;padding:8px;min-height:76px}
.desk b{display:block;color:var(--gold);font-size:12px}
.desk .role{color:var(--muted);font-size:11px}
.desk .mood{font-size:12px;margin-top:4px}
.log,.ticket{background:#0c1018;border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap;max-height:140px;overflow:auto;border:1px solid #222836}
canvas{width:100%;height:110px;background:#080a10;border-radius:8px}
.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px}
.box{background:#141820;border:1px solid var(--gold2);border-radius:14px;padding:16px;max-width:420px;width:100%}
</style>
</head>
<body>
<section id="start">
  <h1>B L U E B L O O D</h1>
  <p class="sub">SALA TRADING WEB</p>
  <p class="hint">10 desk · prezzi live · paper only</p>
  <div class="rules">Pochi trade. Stop e take sul biglietto.<br>Il broker lo muovi tu.</div>
  <div style="text-align:center"><button class="gold" onclick="entra()">ENTRA NELLA SALA</button></div>
  <p class="hint" style="margin-top:18px">Uso personale · nessuna esecuzione reale</p>
</section>
<section id="app">
  <div class="hud">
    <div class="clock" id="clock"></div>
    <div class="cap" id="cap">CAPITALE DEMO €100.00</div>
    <div class="pnl" id="pnl">P&L +0.00%</div>
    <div class="st" id="st">Sala ferma</div>
    <div class="watch" id="watch">WATCHLIST in attesa</div>
  </div>
  <div class="row">
    <button class="gold" id="go" onclick="toggle()">AVVIA SALA</button>
    <button class="blue" onclick="resetCap()">RESET</button>
  </div>
  <div class="row" id="presets"></div>
  <div class="row" id="syms"></div>
  <canvas id="chart"></canvas>
  <div class="grid" id="desks"></div>
  <p class="hint">BIGLIETTO</p>
  <div class="ticket" id="ticket">Nessun segnale ancora.</div>
  <p class="hint">LOG</p>
  <div class="log" id="log"></div>
</section>
<div class="overlay" id="pop"><div class="box" id="popbox"></div></div>
<script>
const SYMBOLS=["AAPL","MSFT","NVDA","SPY","QQQ","EURUSD=X","BTC-USD","ETH-USD","GC=F","CL=F"];
const AGENTS=[
  ["Marco","Trend 15m"],["Giulia","Mean rev"],["Luca","Breakout"],["Sara","Risk"],
  ["Paolo","Volume"],["Elena","Sentiment"],["Davide","Macro"],["Rita","Veto"],
  ["Nico","Scalp"],["Olivia","Flow"]
];
let capital=100, startCap=100, running=false, timer=null, focus="AAPL";
const last={}, desks={};
function $(id){return document.getElementById(id)}
function log(m){const e=$("log"); e.textContent=new Date().toLocaleTimeString()+"  "+m+"\n"+e.textContent; }
function popup(t,b){$("popbox").innerHTML="<b style='color:var(--gold)'>"+t+"</b><p>"+b+"</p><button class='gold' id='okpop'>OK</button>";$("pop").style.display="flex";var b=document.getElementById("okpop"); if(b)b.onclick=function(){$("pop").style.display="none"};
  if(Notification.permission==="granted") new Notification(t,{body:b.replace(/<[^>]+>/g,"")});
}
function entra(){$("start").style.display="none";$("app").style.display="block";
  if(Notification.permission==="default") Notification.requestPermission();
  tickClock(); setInterval(tickClock,1000); buildUI(); log("Sala pronta. Capitale demo 100 EUR.");
}
function tickClock(){$("clock").textContent=new Date().toLocaleString("it-IT")}
function buildUI(){
  $("presets").innerHTML=[100,250,500,1000].map(v=>`<button class="blue" onclick="setCap(${v})">€${v}</button>`).join("");
  $("syms").innerHTML=SYMBOLS.map(s=>`<button class="blue" onclick="focusSym('${s}')">${s.replace("=X","").replace("-USD","")}</button>`).join("");
  $("desks").innerHTML=AGENTS.map(([n,r],i)=>`<div class="desk" id="d${i}"><b>${n}</b><div class="role">${r}</div><div class="mood">STANDBY</div></div>`).join("");
  renderCap();
}
function renderCap(){
  const pnl=((capital-startCap)/startCap)*100;
  $("cap").textContent=`CAPITALE DEMO €${capital.toFixed(2)}`;
  $("pnl").textContent=`P&L ${pnl>=0?"+":""}${pnl.toFixed(2)}%`;
  $("pnl").style.color=pnl>=0?"var(--green)":"var(--red)";
}
function setCap(v){capital=v;startCap=v;renderCap();log("Capitale impostato a €"+v)}
function resetCap(){setCap(startCap);log("Reset capitale")}
function focusSym(s){focus=s;log("Focus "+s); if(running) pullOne(s)}
function toggle(){
  running=!running;
  $("go").textContent=running?"STOP SALA":"AVVIA SALA";
  $("st").textContent=running?"Sala attiva · prezzi live":"Sala ferma";
  if(running){log("Sala avviata"); cycle(); timer=setInterval(cycle,20000)}
  else{clearInterval(timer); log("Sala ferma")}
}
async function pullOne(sym){
  try{
    const r=await fetch("/api/quote?symbol="+encodeURIComponent(sym));
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||"fail");
    last[sym]=j; return j;
  }catch(e){ log("Dato "+sym+" non disponibile"); return null; }
}
function sma(a,n){if(a.length<n)return null; let s=0; for(let i=a.length-n;i<a.length;i++)s+=a[i]; return s/n}
function rsi(a,n=14){
  if(a.length<n+1)return 50;
  let g=0,l=0;
  for(let i=a.length-n;i<a.length;i++){const d=a[i]-a[i-1]; if(d>=0)g+=d; else l-=d;}
  if(!l)return 100; const rs=g/l; return 100-100/(1+rs);
}
function vote(j){
  const c=j.closes||[]; const p=j.price; const s20=sma(c,20), s50=sma(c,Math.min(50,c.length));
  const r=rsi(c); const ch=j.chg||0;
  const out={};
  out[0]= s20 && p>s20 ? "LONG": (s20 && p<s20?"SHORT":"WAIT");
  out[1]= r<32?"LONG":(r>68?"SHORT":"WAIT");
  out[2]= Math.abs(ch)>0.4?(ch>0?"LONG":"SHORT"):"WAIT";
  out[3]= Math.abs(ch)>1.8?"WAIT":(ch>0?"LONG":"SHORT");
  out[4]= (j.volume||0)>0 && ch>0.15?"LONG":((j.volume||0)>0 && ch<-0.15?"SHORT":"WAIT");
  out[5]= ch>0.25?"LONG":(ch<-0.25?"SHORT":"WAIT");
  out[6]= s50 && p>s50?"LONG":(s50 && p<s50?"SHORT":"WAIT");
  out[7]= Math.abs(ch)>2.2?"VETO":"OK";
  out[8]= Math.abs(ch)>0.12 && Math.abs(ch)<0.55?(ch>0?"LONG":"SHORT"):"WAIT";
  out[9]= ch>0?"LONG":(ch<0?"SHORT":"WAIT");
  return out;
}
function paint(closes){
  const cv=$("chart"), ctx=cv.getContext("2d");
  cv.width=cv.clientWidth*2; cv.height=220;
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!closes||closes.length<2)return;
  const min=Math.min(...closes), max=Math.max(...closes), span=max-min||1;
  ctx.strokeStyle="#e8c75a"; ctx.lineWidth=2; ctx.beginPath();
  closes.forEach((v,i)=>{
    const x=i/(closes.length-1)*cv.width;
    const y=cv.height-20-((v-min)/span)*(cv.height-40);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }); ctx.stroke();
}
async function cycle(){
  const watch=[];
  for(const s of SYMBOLS){
    const j=await pullOne(s);
    if(!j) continue;
    watch.push(`${s.replace("=X","")} ${j.price.toFixed(j.price>50?2:4)} (${j.chg>=0?"+":""}${j.chg.toFixed(2)}%)`);
    if(s===focus) paint(j.closes);
    const v=vote(j);
    let long=0,short=0,veto=false;
    AGENTS.forEach((_,i)=>{
      const mood=v[i]||"WAIT";
      const el=document.querySelector("#d"+i+" .mood");
      el.textContent=mood;
      el.style.color=mood==="LONG"?"var(--green)":mood==="SHORT"?"var(--red)":mood==="VETO"?"var(--gold)":"var(--ice)";
      if(mood==="LONG")long++; if(mood==="SHORT")short++; if(mood==="VETO")veto=true;
    });
    if(veto){ log("Rita VETO su "+s); continue; }
    const side=long>=6?"LONG":short>=6?"SHORT":null;
    if(side){
      const sl=side==="LONG"?j.price*0.992:j.price*1.008;
      const tp=side==="LONG"?j.price*1.012:j.price*0.988;
      const txt=`${side} ${s} @ ${j.price.toFixed(4)}<br>SL ${sl.toFixed(4)} · TP ${tp.toFixed(4)}<br>Consenso ${Math.max(long,short)}/10`;
      $("ticket").innerHTML=txt.replace(/<br>/g,"\n");
      popup("SEGNALE "+side, txt);
      log(side+" "+s+" SL "+sl.toFixed(4)+" TP "+tp.toFixed(4));
    }
  }
  $("watch").textContent="WATCHLIST  ·  "+watch.slice(0,5).join("  |  ");
}
</script>
</body>
</html>
